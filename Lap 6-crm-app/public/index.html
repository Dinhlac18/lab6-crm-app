<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Khách Hàng - Lab 6 CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-6">
    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h1 class="text-2xl font-bold text-blue-600 mb-2">Hệ Thống CRM Khách Hàng (Lab 6)</h1>
        <p class="text-gray-600 text-sm mb-6">Kết nối API Serverless trên Vercel phục vụ cho Mobile App.</p>
        
        <!-- Form thêm khách hàng -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-6 bg-blue-50 p-4 rounded-lg">
            <input type="text" id="name" placeholder="Tên khách hàng" class="border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
            <input type="text" id="phone" placeholder="Số điện thoại" class="border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
            <button onclick="addCustomer()" class="bg-blue-600 text-white font-medium px-4 py-2 rounded hover:bg-blue-700 transition">Thêm Khách Hàng</button>
        </div>

        <!-- Danh sách khách hàng -->
        <h2 class="text-lg font-semibold text-gray-800 mb-3">Danh sách khách hàng từ API:</h2>
        <div class="border rounded-lg overflow-hidden">
            <ul id="customer-list" class="divide-y divide-gray-200">
                <!-- Dữ liệu được render bằng JavaScript -->
            </ul>
        </div>
    </div>

    <script>
        async function fetchCustomers() {
            try {
                const res = await fetch('/api/customers');
                const data = await res.json();
                const list = document.getElementById('customer-list');
                list.innerHTML = '';
                
                if (data.length === 0) {
                    list.innerHTML = `<li class="p-4 text-center text-gray-500">Chưa có dữ liệu khách hàng nào.</li>`;
                    return;
                }

                data.forEach(c => {
                    list.innerHTML += `
                        <li class="p-4 flex justify-between items-center hover:bg-gray-50">
                            <div>
                                <p class="font-semibold text-gray-800">${c.name}</p>
                                <p class="text-sm text-gray-500">SĐT: ${c.phone} | Email: ${c.email || 'N/A'}</p>
                            </div>
                            <button onclick="deleteCustomer(${c.id})" class="bg-red-50 text-red-600 px-3 py-1 rounded text-sm hover:bg-red-100 transition">Xóa</button>
                        </li>`;
                });
            } catch (error) {
                console.error("Lỗi tải dữ liệu:", error);
            }
        }

        async function addCustomer() {
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            
            if (!name || !phone) {
                alert("Vui lòng nhập đầy đủ tên và số điện thoại!");
                return;
            }

            await fetch('/api/customers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, phone })
            });

            document.getElementById('name').value = '';
            document.getElementById('phone').value = '';
            fetchCustomers();
        }

        async function deleteCustomer(id) {
            if (confirm("Bạn có chắc chắn muốn xóa khách hàng này không?")) {
                await fetch(`/api/customers?id=${id}`, { method: 'DELETE' });
                fetchCustomers();
            }
        }

        // Tải danh sách khi mở trang
        fetchCustomers();
    </script>
</body>
</html>
